[package]
name = "rocket-service"
version = "0.1.0"
edition = "2021"
description = "Rocket VPN privileged helper service"

[[bin]]
name = "rocket-svc"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
